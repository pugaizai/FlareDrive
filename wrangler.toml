# FlareDrive —— Cloudflare Pages 配置
# 参考：https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "flare-drive"
compatibility_date = "2024-06-20"
pages_build_output_dir = "build"

# R2 存储桶绑定：把 bucket_name 替换为你实际创建的 bucket 名称。
# 也可以不填此处，改在 Pages 控制台里手动绑定名为 BUCKET 的存储桶。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flare-drive" # TODO: 替换为你的 R2 bucket 名称

# 环境变量：不要把真实凭据提交到仓库！
# 生产环境建议在 Pages 控制台或通过 `npx wrangler pages secret put` 配置。
# 本地开发可复制 .dev.vars.example 为 .dev.vars 填入。
[vars]
WEBDAV_USERNAME = ""
WEBDAV_PASSWORD = ""
# WEBDAV_PUBLIC_READ = "1"
